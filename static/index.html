<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datacom Kudos</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="shell"><h1>✦ Kudos</h1><p>Recognize the people who make a difference.</p></div></header>
<main class="shell">
<section id="login" class="panel"><h2>Sign in</h2><p class="hint">For this local demo, use alex@example.test or admin@example.test, password DemoPass123!</p>
<form id="loginForm"><label>Email<input name="email" type="email" required value="alex@example.test"></label>
<label>Password<input name="password" type="password" required></label><button>Sign in</button></form></section>
<div id="portal" hidden><div class="toolbar"><span id="identity"></span><button id="logout" class="secondary">Log out</button></div>
<div class="columns"><section class="panel"><h2>Send appreciation</h2><form id="kudosForm"><label>Colleague<select id="recipient" required></select></label>
<label>Your message<textarea id="message" maxlength="500" rows="5" placeholder="Thank you for…" required></textarea></label>
<div class="field-foot"><small>Keep it kind and specific.</small><small id="length">0 / 500</small></div><button>Send kudos</button></form></section>
<section class="panel"><h2>Recent kudos</h2><div id="feed"></div><div class="pager"><button id="prev" class="secondary">Previous</button><span id="pageLabel"></span><button id="next" class="secondary">Next</button></div></section></div>
<section id="adminPanel" class="panel" hidden><h2>Administrator moderation</h2><p class="hint">Hide, restore, or delete inappropriate kudos.</p><div id="adminFeed"></div></section>
</div><p id="status" role="status" aria-live="polite"></p></main>
<script src="/app.js"></script></body></html>
